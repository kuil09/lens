name: Lens CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lens-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test-build:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      # Available in the official macos-26 runner manifest; never use its moving default.
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      LENS_TEST_INSTALLED_LANGUAGES: '0'
    steps:
      - name: Validate selected Xcode before checkout or compilation
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          version=$(xcodebuild -version | awk '/^Xcode / {print $2}')
          test "$version" = 26.4.1
          xcrun --sdk macosx --show-sdk-version
          xcrun swift --version
      # Pin the action revision; Dependabot proposes updates separately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository and shell regressions
        run: make check
      - name: Unit tests (installed language tests disabled)
        run: make test
      - name: Ad-hoc Release build
        run: make build

  package-dmg:
    needs: check-test-build
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install DMG packaging dependencies
        run: |
          pip install -r Packaging/requirements.txt
      - name: Build Development DMG
        run: |
          make package --development --format dmg
      - name: Upload DMG artifact
        uses: actions/upload-artifact@8f95495a34f086e3c5e8093775a395635438e5d9 # v4.6.2
        with:
          name: Lens-dmg
          path: dist/*.dmg
          retention-days: 7
