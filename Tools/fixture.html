<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Lens validation fixture</title>
<style>body{font:20px/1.5 system-ui;margin:24px;background:#f7f5ef;color:#20242a}nav{display:flex;gap:8px;position:sticky;top:0;background:#f7f5ef;padding:8px}button{font:inherit}main{max-width:700px}article{background:white;padding:22px;border-radius:12px;margin:18px 0}h2{font-size:24px}#count{font-weight:bold}</style>
<nav><button onclick="setLanguage('en')">English</button><button onclick="setLanguage('ja')">日本語</button><button onclick="setLanguage('ko')">한국어</button><button onclick="count++;document.querySelector('#count').textContent=count">Click test: <span id="count">0</span></button></nav>
<main id="content"></main>
<script>
let count=0;
const text={en:['Screen translation test','Do not close this window before saving your changes.','Your invitation is valid for 24 hours.','Please send the report to Kim Jisu.','The price is 1,250 yen, including tax.','No files will be deleted.','You can use this application without an internet connection after downloading the language packs.'],ja:['画面翻訳テスト','変更を保存する前に、このウィンドウを閉じないでください。','招待は24時間有効です。','キム・ジスに報告書を送ってください。','価格は税込み1,250円です。','ファイルは削除されません。','言語パックをダウンロードした後は、インターネット接続なしでこのアプリを使用できます。'],ko:['화면 번역 테스트','변경 사항을 저장하기 전에 이 창을 닫지 마세요.','초대는 24시간 동안 유효합니다.','김지수에게 보고서를 보내 주세요.','가격은 세금 포함 1,250엔입니다.','파일은 삭제되지 않습니다.','언어 팩을 다운로드한 후에는 인터넷 연결 없이 이 앱을 사용할 수 있습니다.']};
function setLanguage(lang){document.documentElement.lang=lang;document.querySelector('#content').replaceChildren(...Array.from({length:5},(_,i)=>{const a=document.createElement('article');const h=document.createElement('h2');h.textContent=text[lang][0]+' '+(i+1);a.append(h);for(const t of text[lang].slice(1)){const p=document.createElement('p');p.textContent=t;a.append(p)}return a}))}setLanguage('en');
</script></html>
